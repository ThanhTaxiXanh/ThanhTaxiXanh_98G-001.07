name: taxi_auto
description: Modular Flutter companion application for taxi drivers.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  mt_carplay: ^1.7.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  vietqr_widget: ^0.1.1+3
  sqflite: ^2.4.5
  flutter_riverpod: ^3.4.3
  audio_service: ^0.18.19
  just_audio: ^0.10.6
  shared_preferences: ^2.5.6
  webview_flutter: ^4.14.1
  http: ^1.6.0
  image_picker: ^1.2.4
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
